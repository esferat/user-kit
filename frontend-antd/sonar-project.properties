# SonarQube/SonarCloud project configuration of the Ant Design frontend.
# The same rules also run locally through `npm run lint` (eslint-plugin-sonarjs),
# so a finding is visible before it reaches the server.
sonar.projectKey=user-kit-frontend-antd
sonar.projectName=User Kit frontend (Ant Design)
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=src
sonar.sourceEncoding=UTF-8

sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.coverage.exclusions=src/main.tsx,src/vite-env.d.ts,**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=\
  src/main.tsx,\
  src/vite-env.d.ts,\
  **/*.test.ts,\
  **/*.test.tsx

# Feature Sliced Design: the public API of a slice is its index.ts, everything
# else may change without a consumer noticing.
sonar.exclusions+=**/index.ts
