name: user-kit

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-userkit}
      POSTGRES_USER: ${DATABASE_USERNAME:-userkit}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-userkit}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USERNAME:-userkit} -d ${DATABASE_NAME:-userkit}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  object-storage:
    # Silo is a community maintained fork of the MinIO server with the same S3
    # API, storage format and MINIO_* configuration contract.
    image: ${SILO_IMAGE:-pgsty/silo}:${SILO_VERSION:-latest}
    command: server /data --console-address ":9001"
    environment:
      # The backend uses the same credentials through the S3 API, Silo reads the
      # MINIO_* names on purpose
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-siloadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-siloadmin}
    volumes:
      - object-storage-data:/data
    ports:
      # Web console of the storage for local inspection, the S3 API stays internal
      - "${SILO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      # Silo keeps the reserved /minio/* routes of the MinIO server
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  keycloak:
    # Adds a writable log directory to the Keycloak image, see keycloak/Dockerfile
    build:
      context: ./keycloak
      args:
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION:-26.4}
    command: start-dev --import-realm
    environment:
      # Administration console of the local instance, dev-only credentials.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: dev-file
      # Keycloak serves the realm under /auth, nginx forwards that prefix, so the
      # issuer stays on the origin of the application:
      # https://${SERVER_NAME:-user-kit.local}/auth/realms/user-kit
      KC_HTTP_RELATIVE_PATH: ${KEYCLOAK_RELATIVE_PATH:-/auth}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-https://user-kit.local/auth}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: ${KEYCLOAK_LOG_LEVEL:-info}
      KC_METRICS_ENABLED: "false"
      # Write to the console and to data/log/keycloak.log, the file inside the
      # keycloak-logs volume that Logstash tails.
      KC_LOG: console,file
      KC_LOG_FILE: /opt/keycloak/data/log/keycloak.log
      # nginx terminates TLS in front of the container, Keycloak has to trust the
      # forwarded protocol and client address
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      # Shared with Logstash, which reads the log file read only
      - keycloak-logs:/opt/keycloak/data/log
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    healthcheck:
      # The management port serves the health endpoints below the same relative
      # path as the main server, so KC_HTTP_RELATIVE_PATH has to be part of it.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET ${KEYCLOAK_RELATIVE_PATH:-/auth}/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          timeout 2 cat <&3 | grep -q '"status": "UP"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-userkit}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-userkit}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-userkit}
      OIDC_ENABLED: ${OIDC_ENABLED:-true}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-https://user-kit.local/auth/realms/user-kit}
      # Keys are fetched from the container network, the issuer above stays the
      # external URL, so the backend validates iss without trusting the dev CA.
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:-http://keycloak:8080/auth/realms/user-kit/protocol/openid-connect/certs}
      OIDC_AUDIENCES: ${OIDC_AUDIENCES:-user-kit-api}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}
      # Cookie based login: the backend is the OAuth client of the realm, the
      # browser only receives httpOnly cookies.
      OIDC_CLIENT_ENABLED: ${OIDC_CLIENT_ENABLED:-true}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-user-kit-bff}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-user-kit-bff-dev-secret-change-me}
      OIDC_CLIENT_ISSUER_URI: ${OIDC_CLIENT_ISSUER_URI:-http://keycloak:8080/auth/realms/user-kit}
      # One callback per frontend. A login always comes back to the domain it was
      # started on, because the cookies of the other domain stay unknown to the
      # browser and the state row keeps the exact callback of that login. The
      # default lists all domains of this stack, override them to shrink the
      # allowlist; .env carries the same entries.
      OIDC_CLIENT_REDIRECT_URIS: ${OIDC_CLIENT_REDIRECT_URIS:-https://user-kit.local/api/v1/auth/callback,https://user-kit.next.local/api/v1/auth/callback}
      OIDC_CLIENT_POST_LOGOUT_REDIRECT_URIS: ${OIDC_CLIENT_POST_LOGOUT_REDIRECT_URIS:-https://user-kit.local/,https://user-kit.next.local/}
      # Singular values stay as the fallback of the lists above, they are what a
      # login state without a callback of its own falls back to.
      OIDC_CLIENT_REDIRECT_URI: ${OIDC_CLIENT_REDIRECT_URI:-https://user-kit.local/api/v1/auth/callback}
      OIDC_CLIENT_POST_LOGOUT_REDIRECT_URI: ${OIDC_CLIENT_POST_LOGOUT_REDIRECT_URI:-https://user-kit.local/}
      OIDC_CLIENT_SCOPES: ${OIDC_CLIENT_SCOPES:-openid profile email}
      OIDC_LOGIN_STATE_TTL: ${OIDC_LOGIN_STATE_TTL:-10m}
      OIDC_SESSION_TTL: ${OIDC_SESSION_TTL:-12h}
      OIDC_REFRESH_WINDOW: ${OIDC_REFRESH_WINDOW:-90s}
      # The local stack is served over HTTPS and over plain HTTP on localhost, so
      # the cookies are not marked Secure here; set it to true in production.
      OIDC_COOKIE_SECURE: ${OIDC_COOKIE_SECURE:-false}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-true}
      DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      S3_ENDPOINT: http://object-storage:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-user-kit}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-siloadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-siloadmin}
      S3_PATH_STYLE: "true"
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-true}
      # Demo documents for an empty store, dev profile only
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
      # Application log file that the Logstash container tails. The pattern is
      # "[level]-[date]- message". Set the variable empty to log to the console
      # only, for example when the backend runs outside of this compose stack.
      LOG_FILE: ${LOG_FILE-/var/log/user-kit/backend.log}
    volumes:
      # Shared with Logstash, which reads the file read only
      - backend-logs:/var/log/user-kit
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_started
      keycloak:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  # Single frontend: a Next.js full stack application on its own domain.
  frontend-main:
    build:
      context: ./frontend-main
      args:
        NEXT_PUBLIC_API_BASE_URL: ${VITE_API_BASE_URL:-}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped

  # Central log store. Logstash tails the log files of the backend, Keycloak and
  # the edge and indexes one document per event into this cluster, Kibana reads
  # the user-kit-backend-*, user-kit-keycloak-* and user-kit-nginx-* indices.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.15.3}
    environment:
      discovery.type: single-node
      # Local development only: the dev stack runs without TLS and without a
      # password, a production deployment has to enable security here.
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      # Optional direct access for curl and the API, Kibana reaches it internally
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      # Only checks that the API answers. A single-node cluster turns yellow as
      # soon as an index has a replica, so requiring "green" would keep Logstash
      # and Kibana from ever starting after the first index exists.
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-8.15.3}
    environment:
      # The pipeline lives in ./logstash/pipeline, ECS output keeps the
      # standard field names of the Elastic stack.
      LS_JAVA_OPTS: ${LOGSTASH_JAVA_OPTS:--Xms256m -Xmx256m}
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      # Persists the sincedb so a restart continues where the last run stopped
      - logstash-data:/usr/share/logstash/data
      # The log volumes the other containers write into, read only here
      - backend-logs:/var/log/user-kit:ro
      - keycloak-logs:/opt/keycloak/data/log:ro
      - nginx-logs:/var/log/user-kit-nginx:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.15.3}
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  edge:
    image: nginx:1.27-alpine
    depends_on:
      - frontend-main
      - backend
      - keycloak
      - kibana
    environment:
      # Canonical domain: serves the identity provider under /auth, so the issuer
      # of the tokens is a single origin for all frontends.
      SERVER_NAME: ${SERVER_NAME:-user-kit.local}
      SERVER_NAME_NEXT: ${SERVER_NAME_NEXT:-user-kit.next.local}
      # Reverse proxy in front of Kibana, so the log UI is reachable over the
      # same TLS edge as the applications instead of the published 5601 port.
      SERVER_NAME_KIBANA: ${SERVER_NAME_KIBANA:-user-kit.kibana.local}
      UPSTREAM_FRONTEND_MAIN: frontend-main:3000
      UPSTREAM_BACKEND: backend:8080
      UPSTREAM_KEYCLOAK: keycloak:8080
      UPSTREAM_KIBANA: kibana:5601
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-26m}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # Access and error log in nginx format, shared read only with Logstash
      - nginx-logs:/var/log/user-kit-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    restart: unless-stopped

volumes:
  postgres-data:
  object-storage-data:
  backend-logs:
  keycloak-logs:
  nginx-logs:
  elasticsearch-data:
  logstash-data:
