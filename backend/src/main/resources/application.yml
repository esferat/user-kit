spring:
  application:
    name: user-kit-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/userkit}
    username: ${DATABASE_USERNAME:userkit}
    password: ${DATABASE_PASSWORD:userkit}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  jackson:
    deserialization:
      # Reject unknown request properties instead of ignoring them, so a
      # misspelled or read-only field in a request body fails with HTTP 400.
      fail-on-unknown-properties: true
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  security:
    oidc:
      enabled: ${OIDC_ENABLED:true}
      issuer-uri: ${OIDC_ISSUER_URI:}
      # Optional. Set it when the issuer URL is not reachable from the backend,
      # for example when Keycloak runs under a different name inside the Docker
      # network. Keys are then fetched from here while iss is still validated
      # against issuer-uri.
      jwk-set-uri: ${OIDC_JWK_SET_URI:}
      audiences: ${OIDC_AUDIENCES:user-kit-api}
      roles-claim: ${OIDC_ROLES_CLAIM:roles}
    dev:
      enabled: ${DEV_AUTH_ENABLED:false}
      issuer: user-kit-dev
      secret: ${DEV_AUTH_SECRET:dev-only-secret-change-me-0123456789abcdef}
      token-ttl: 12h
    oauth:
      # Cookie based login: the backend is the OAuth client, the browser only
      # receives httpOnly cookies and the refresh token stays in the database.
      enabled: ${OIDC_CLIENT_ENABLED:false}
      client-id: ${OIDC_CLIENT_ID:user-kit-bff}
      client-secret: ${OIDC_CLIENT_SECRET:}
      # Optional. Set it when the discovery document is not reachable under the
      # issuer URL, for example when Keycloak only answers on the container network.
      issuer-uri: ${OIDC_CLIENT_ISSUER_URI:}
      redirect-uri: ${OIDC_CLIENT_REDIRECT_URI:https://user-kit.local/api/v1/auth/callback}
      post-logout-redirect-uri: ${OIDC_CLIENT_POST_LOGOUT_REDIRECT_URI:https://user-kit.local/}
      # One callback per frontend, comma separated. A login always continues on the
      # domain it started on, because the session cookies of the other domain would
      # be unknown to the browser. Empty keeps the singular property above.
      redirect-uris: ${OIDC_CLIENT_REDIRECT_URIS:}
      post-logout-redirect-uris: ${OIDC_CLIENT_POST_LOGOUT_REDIRECT_URIS:}
      scopes: ${OIDC_CLIENT_SCOPES:openid profile email}
      login-state-ttl: ${OIDC_LOGIN_STATE_TTL:10m}
      session-ttl: ${OIDC_SESSION_TTL:12h}
      # Renew the access token when it expires within this window, so a request
      # never races the expiry of the token the browser sends.
      refresh-window: ${OIDC_REFRESH_WINDOW:90s}
      cookie-secure: ${OIDC_COOKIE_SECURE:true}
      cookie-domain: ${OIDC_COOKIE_DOMAIN:}
  cors:
    # Comma separated list of browser origins, empty keeps the API same origin only
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-headers: ${CORS_ALLOWED_HEADERS:}
    exposed-headers: ${CORS_EXPOSED_HEADERS:}
    max-age: ${CORS_MAX_AGE:30m}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:user-kit}
    access-key: ${S3_ACCESS_KEY:siloadmin}
    secret-key: ${S3_SECRET_KEY:siloadmin}
    path-style-access: ${S3_PATH_STYLE:true}
    create-bucket: ${S3_CREATE_BUCKET:true}
  files:
    max-size-bytes: ${FILES_MAX_SIZE_BYTES:26214400}
  rest:
    max-page-size: ${REST_MAX_PAGE_SIZE:200}
