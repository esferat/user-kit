spring:
  config:
    activate:
      on-profile: dev
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.acme.usermark: DEBUG
    org.springframework.security: INFO

app:
  cors:
    # `npm run dev` serves the frontend on port 5173 and proxies /api and /odata to
    # the backend, so the browser sends an Origin header and a preflight for every
    # write. The nginx deployment shares one origin and keeps this empty.
    # CORS_ALLOWED_ORIGINS still overrides the default.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    dev:
      enabled: true
