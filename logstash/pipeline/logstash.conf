# Ships the application logs of user-kit to Elasticsearch.
#
# Three sources, each written by its container into a shared volume and tailed
# here:
#
#   * backend  - "[level]-[date]- message" lines
#   * keycloak - Quarkus file log, "date LEVEL [logger] (thread) message"
#   * nginx    - JSON access log plus the plain error log of the edge
#
# A Java stack trace continues on following lines that do not start with the
# leading token of a log line, the multiline codec joins them into one event
# before the grok filter parses the first line.
input {
  file {
    path => "/var/log/user-kit/backend.log*"
    start_position => "beginning"
    # Kept in the logstash-data volume so a restart continues at the last offset
    sincedb_path => "/usr/share/logstash/data/.sincedb_backend"
    tags => ["backend"]
    codec => multiline {
      pattern => "^\["
      negate => true
      what => "previous"
    }
  }

  file {
    path => "/opt/keycloak/data/log/keycloak.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/.sincedb_keycloak"
    tags => ["keycloak"]
    codec => multiline {
      pattern => "^\d{4}-\d{2}-\d{2} "
      negate => true
      what => "previous"
    }
  }

  file {
    path => "/var/log/user-kit-nginx/access.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/.sincedb_nginx_access"
    tags => ["nginx", "nginx_access"]
  }

  file {
    path => "/var/log/user-kit-nginx/error.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/.sincedb_nginx_error"
    tags => ["nginx", "nginx_error"]
  }
}

filter {
  # ----- backend ---------------------------------------------------------------
  if "backend" in [tags] {
    grok {
      match => {
        "message" => "^\[%{LOGLEVEL:log.level}\]-\[%{TIMESTAMP_ISO8601:log.timestamp}\]- (?<log.message>[\s\S]*)"
      }
      tag_on_failure => ["_grokparsefailure"]
    }
    date {
      match => ["log.timestamp", "yyyy-MM-dd HH:mm:ss.SSS"]
      target => "@timestamp"
    }
    # Only when grok matched, so a changed pattern keeps the raw line.
    if "_grokparsefailure" not in [tags] {
      mutate { replace => { "message" => "%{log.message}" } }
    }
    mutate { remove_field => ["log.timestamp", "log.message"] }
  }

  # ----- keycloak --------------------------------------------------------------
  else if "keycloak" in [tags] {
    grok {
      match => {
        "message" => "^(?<log.timestamp>%{YEAR}-%{MONTHNUM}-%{MONTHDAY} %{HOUR}:%{MINUTE}:%{SECOND},%{INT}) %{LOGLEVEL:log.level} +\[%{DATA:log.logger}\] \(%{DATA:log.thread}\) (?<log.message>[\s\S]*)"
      }
      tag_on_failure => ["_grokparsefailure"]
    }
    date {
      match => ["log.timestamp", "yyyy-MM-dd HH:mm:ss,SSS"]
      target => "@timestamp"
    }
    if "_grokparsefailure" not in [tags] {
      mutate { replace => { "message" => "%{log.message}" } }
    }
    mutate { remove_field => ["log.timestamp", "log.message"] }
  }

  # ----- nginx access ----------------------------------------------------------
  else if "nginx_access" in [tags] {
    json {
      source => "message"
      target => "nginx"
    }
    date {
      match => ["[nginx][time]", "ISO8601"]
      target => "@timestamp"
    }
    mutate {
      replace => { "message" => "%{[nginx][method]} %{[nginx][uri]} -> %{[nginx][status]}" }
    }
  }

  # ----- nginx error -----------------------------------------------------------
  else if "nginx_error" in [tags] {
    grok {
      # Example: 2026/10/13 12:00:00 [error] 30#30: *1 open() "..." failed
      match => {
        "message" => "^(?<nginx.time>%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{HOUR}:%{MINUTE}:%{SECOND}) \[%{LOGLEVEL:log.level}\] %{NUMBER:nginx.pid}#%{NUMBER:nginx.tid}: (?:\*%{NUMBER:nginx.cid} )?(?<log.message>[\s\S]*)"
      }
      tag_on_failure => ["_grokparsefailure"]
    }
    date {
      match => ["nginx.time", "yyyy/MM/dd HH:mm:ss"]
      target => "@timestamp"
    }
    if "_grokparsefailure" not in [tags] {
      mutate { replace => { "message" => "%{log.message}" } }
    }
    mutate { remove_field => ["nginx.time", "log.message", "nginx.tid"] }
  }

  # Single field the Kibana data views can filter on.
  if "backend" in [tags] {
    mutate { add_field => { "service" => "backend" } }
  } else if "keycloak" in [tags] {
    mutate { add_field => { "service" => "keycloak" } }
  } else if "nginx" in [tags] {
    mutate { add_field => { "service" => "nginx" } }
  }
}

output {
  if "backend" in [tags] {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "user-kit-backend-%{+YYYY.MM.dd}" }
  } else if "keycloak" in [tags] {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "user-kit-keycloak-%{+YYYY.MM.dd}" }
  } else if "nginx" in [tags] {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "user-kit-nginx-%{+YYYY.MM.dd}" }
  }
}
