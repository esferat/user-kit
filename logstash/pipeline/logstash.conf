# Ships the backend logs of user-kit to Elasticsearch.
#
# The backend writes one file into the shared "backend-logs" volume, every line
# has the shape
#
#   [LEVEL]-[yyyy-MM-dd HH:mm:ss.SSS]- message
#
# A Java stack trace continues on following lines that do not start with "[",
# the multiline codec joins them into a single event before the grok filter
# parses the first line.
input {
  file {
    path => "/var/log/user-kit/backend.log*"
    start_position => "beginning"
    # Kept in the logstash-data volume so a restart continues at the last offset.
    sincedb_path => "/usr/share/logstash/data/.sincedb_backend"
    codec => multiline {
      pattern => "^\["
      negate => true
      what => "previous"
    }
  }
}

filter {
  # Parse "[level]-[date]- message" of the raw line. The capture goes into
  # "log.message", not into "message": capturing into the field that is being
  # matched would turn "message" into an array.
  grok {
    match => {
      "message" => "^\[%{LOGLEVEL:log.level}\]-\[%{TIMESTAMP_ISO8601:log.timestamp}\]- %{GREEDYDATA:log.message}"
    }
    tag_on_failure => ["_grokparsefailure"]
  }

  # Use the timestamp of the log line, not the time Logstash read it.
  date {
    match => ["log.timestamp", "yyyy-MM-dd HH:mm:ss.SSS"]
    target => "@timestamp"
  }

  # Replace the raw line with the parsed text. Only when grok matched, so a
  # changed console pattern keeps the raw line instead of losing it.
  if "_grokparsefailure" not in [tags] {
    mutate {
      replace => { "message" => "%{log.message}" }
    }
  }

  mutate {
    remove_field => ["log.timestamp", "log.message"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "user-kit-backend-%{+YYYY.MM.dd}"
  }
}
