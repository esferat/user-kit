# SonarQube analysis for the user-profile microfrontend.
# Run with `npx sonar-scanner -Dsonar.host.url=... -Dsonar.token=...`.

sonar.projectKey=user-profile
sonar.projectName=user-profile

sonar.sources=src,shared,api
sonar.exclusions=**/node_modules/**,**/dist/**,**/.output/**,**/.mf/**,**/@mf-types/**

sonar.typescript.tsconfigPath=tsconfig.json
sonar.sourceEncoding=UTF-8

# No automated tests in this project yet; the contract with the backend is
# covered by ../scripts/smoke.ps1.
sonar.coverage.exclusions=**/*
